apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-app
  labels:
    app: reservation-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservation-app
  template:
    metadata:
      labels:
        app: reservation-app
    spec: 
      containers:
        - name: reservation-app-container
          ports:
            - containerPort: 8080
          image: utkarsh1313/radison-reservation-app-sk:latest
  strategy:
    type: RollingUpdate
